name: Kaynak taramasi

on:
  schedule:
    - cron: "0 5 * * *"         # UTC — TR 08:00: tarama + günlük analiz
    - cron: "0 11,17 * * *"     # UTC — TR 14:00 ve 20:00: yalnızca tarama
  workflow_dispatch:
    inputs:
      discover:
        description: "Bu turda kac kaynak icin yeni RSS akisi aransin"
        default: "120"
      analiz:
        description: "Gunluk analiz da uretilsin mi? (evet/hayir)"
        default: "hayir"
  push:
    paths:
      - "scripts/**"
      - "data/sources.json"
      - ".github/workflows/tarama.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kaynaklari tara
        run: |
          python3 scripts/collect.py \
            --discover ${{ github.event.inputs.discover || '120' }} \
            --news 140 --images 90 --workers 16

      # Gunluk analiz: yalnizca sabah taramasinda (05:00 UTC) ya da elle istendiginde.
      # Anahtar tanimli degilse sessizce atlanir; analiz hatasi taramayi bozmaz.
      - name: Gunluk analiz
        if: github.event_name == 'schedule' && github.event.schedule == '0 5 * * *' || github.event.inputs.analiz == 'evet'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALIZ_MODEL: ${{ vars.ANALIZ_MODEL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY tanimli degil; analiz atlandi."
            exit 0
          fi
          python3 -m pip install --quiet --disable-pip-version-check anthropic
          python3 scripts/analiz.py

      - name: Sonuclari isle
        run: |
          git config user.name "gundem-bot"
          git config user.email "actions@github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "veri: tarama $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # enablement: Pages depoda kapaliysa is akisi kendisi acar (pages: write)
      - uses: actions/configure-pages@v5
        continue-on-error: true
        id: pages
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: .
    outputs:
      pages: ${{ steps.pages.outcome }}

  yayinla:
    needs: tara
    if: needs.tara.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
