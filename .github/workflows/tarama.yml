name: Kaynak taramasi

on:
  schedule:
    # GitHub zamanlanmis kosulari en iyi caba ile calistirir; bu depoda
    # olculen gecikme 3-4,5 saat. Bu yuzden gunun ilk turu erken saate
    # kuruldu: 02:00 UTC + gecikme ~ TR 09:00. Analiz her turda denenir,
    # o gune ait analiz varsa saniyeler icinde atlanir; boylece gunun
    # analizi GitHub ne zaman firsat verirse o zaman, en erken cikar.
    - cron: "0 2 * * *"         # hedef TR 05:00, fiilen ~TR 09:00
    - cron: "0 6 * * *"         # hedef TR 09:00, fiilen ~TR 13:00
    - cron: "0 11,17 * * *"     # hedef TR 14:00 ve 20:00
  workflow_dispatch:
    inputs:
      discover:
        description: "Bu turda kac kaynak icin yeni RSS akisi aransin"
        default: "120"
      analiz:
        description: "Gunluk analiz da uretilsin mi? (evet/hayir)"
        default: "hayir"
      analiz_yenile:
        description: "Bugunun analizi varsa uzerine yazilsin mi? (evet/hayir)"
        default: "evet"
      sentez:
        description: "Haftalik sentez de uretilsin mi? (evet/hayir)"
        default: "hayir"
      sadece_denetim:
        description: "Analizi yeniden uretmeden yalnizca oz-denetim yapilsin mi? (evet/hayir)"
        default: "hayir"
  push:
    # Arayuz dosyalari da yayin tetiklemeli: yoksa app.js/style.css degisikligi
    # canli siteye hic gitmiyor.
    paths:
      - "index.html"
      - "haber.html"
      - "assets/**"
      - "scripts/**"
      - "manifest.webmanifest"
      - "icon*"
      - "robots.txt"
      - "_headers"
      - "data/sources.json"
      - ".github/workflows/tarama.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kaynaklari tara
        run: |
          python3 scripts/collect.py \
            --discover ${{ github.event.inputs.discover || '120' }} \
            --news 140 --images 90 --workers 16

      # Ceviri: Turkce olmayan kayitlarin baslik/ozetleri. Her kayit bir kez
      # cevrilir (data/ceviri.json onbellegi), o yuzden her turda ucuz kalir.
      - name: Ceviri
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          CEVIRI_MODEL: ${{ vars.CEVIRI_MODEL || 'claude-haiku-4-5' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY yok; ceviri atlandi."
            exit 0
          fi
          python3 -m pip install --quiet --disable-pip-version-check anthropic
          python3 scripts/ceviri.py --adet 200

      # Gunluk analiz: yalnizca sabah taramasinda (05:00 UTC) ya da elle istendiginde.
      # Anahtar tanimli degilse sessizce atlanir; analiz hatasi taramayi bozmaz.
      - name: Gunluk analiz
        if: github.event_name == 'schedule' || github.event.inputs.analiz == 'evet'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          ANALIZ_MODEL: ${{ vars.ANALIZ_MODEL || 'claude-opus-5' }}
          ANALIZ_YENILE: ${{ github.event.inputs.analiz_yenile || 'hayir' }}
          SADECE_DENETIM: ${{ github.event.inputs.sadece_denetim || 'hayir' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY bos geldi; analiz atlandi."
            echo "Kontrol listesi:"
            echo "  1) Settings > Secrets and variables > Actions > 'Secrets' sekmesi"
            echo "     (Variables sekmesi degil) altinda 'Repository secrets' listesinde"
            echo "     ANTHROPIC_API_KEY gorunuyor mu?"
            echo "  2) Ad birebir ANTHROPIC_API_KEY mi (bosluk/turkce harf yok)?"
            echo "  3) Environment secret olarak eklendiyse bu is akisina gelmez;"
            echo "     repository secret olarak ekle."
            exit 0
          fi
          echo "anahtar bulundu (uzunluk: ${#ANTHROPIC_API_KEY})"
          # Gunun analizi varsa hicbir sey yapma: boylece analiz adimini
          # her turda guvenle calistirabiliyoruz (ilk tur uretir, otekiler
          # atlar) ve analiz gunun ilk turunda cikar.
          GUN=$(date -u '+%Y-%m-%d')
          if [ -f "data/analiz/$GUN.json" ] \
             && [ "$ANALIZ_YENILE" != "evet" ] && [ "$SADECE_DENETIM" != "evet" ]; then
            echo "$GUN analizi zaten var; adim atlandi."
            exit 0
          fi
          python3 -m pip install --quiet --disable-pip-version-check anthropic
          # One cikan kayitlarin tam metnini indir: analiz basliktan fazlasini gorsun
          python3 scripts/tam_metin.py --adet 18 || true
          # Birincil belgeler: AIHM kararlarinin kendi metni (HUDOC). Haber
          # kayitlari kararlari aktariyor; analiz karari da gormus olsun.
          python3 scripts/birincil.py --gun-sayisi 21 --adet 8 || true
          # Elle tetiklenen turda "analiz_yenile: evet" ise o gunun analizi varsa
          # uzerine yazilir; zamanlanmis turlarda mevcut analiz korunur.
          # Adimin cikisi hem kutuge hem yayinlanan bir dosyaya yazilir:
          # analiz adimi hatayi yutuyor (tarama bozulmasin diye) ve neden
          # uretilmedigi baska turlu gorunmuyor.
          KUTUK="$RUNNER_TEMP/analiz.log"
          # -e acik: hata halinde kutugu yazmadan cikmasin diye kapatiyoruz
          set +e
          set -o pipefail
          if [ "$SADECE_DENETIM" = "evet" ]; then
            # Analiz yeniden uretilmez; var olan analiz denetlenir (ucuz).
            python3 scripts/analiz.py --yalniz-denetim 2>&1 | tee "$KUTUK"
          elif [ "$ANALIZ_YENILE" = "evet" ]; then
            python3 scripts/analiz.py --zorla 2>&1 | tee "$KUTUK"
          else
            python3 scripts/analiz.py 2>&1 | tee "$KUTUK"
          fi
          SONUC=$?
          {
            echo "# analiz adimi $(date -u '+%Y-%m-%d %H:%M UTC') · cikis kodu $SONUC"
            tail -n 60 "$KUTUK"
          } > data/analiz-log.txt
          exit $SONUC

      # Haftalik sentez: pazar sabahi taramasinda ya da elle istendiginde.
      # Gunluk analizlere bakar, yeniden tarama ya da tam metin indirmez.
      - name: Haftalik sentez
        if: github.event_name == 'schedule' || github.event.inputs.sentez == 'evet'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          SENTEZ_MODEL: ${{ vars.SENTEZ_MODEL || vars.ANALIZ_MODEL || 'claude-opus-5' }}
          SENTEZ_ELLE: ${{ github.event.inputs.sentez || 'hayir' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY yok; sentez atlandi."
            exit 0
          fi
          # Zamanlanmis turda yalnizca pazar gunu calisir; elle istenirse her gun.
          if [ "$SENTEZ_ELLE" != "evet" ] && [ "$(date -u +%u)" != "7" ]; then
            echo "Pazar degil; haftalik sentez atlandi."
            exit 0
          fi
          # Haftanin sentezi varsa yeniden uretme (gun icinde birden fazla
          # tur pazar gunune denk gelebiliyor).
          if [ -f "data/sentez/$(date -u '+%Y-%m-%d').json" ] && [ "$SENTEZ_ELLE" != "evet" ]; then
            echo "bugunun sentezi zaten var; atlandi."
            exit 0
          fi
          python3 -m pip install --quiet --disable-pip-version-check anthropic
          python3 scripts/sentez.py

      # Uyari: esik asildiginda haber ver. Kural tutmazsa hicbir sey yapmaz;
      # ayni uyari iki kez gonderilmez (data/uyari-gecmis.json).
      - name: Uyari esikleri
        id: uyari
        continue-on-error: true
        run: python3 scripts/uyari.py --cikti "$RUNNER_TEMP/uyari.md"

      # Kanal 1: GitHub konusu. Depo sahibine GitHub kendisi e-posta gonderir,
      # ekstra kurulum gerekmez.
      - name: Uyari konusu ac
        if: steps.uyari.outputs.uyari == 'evet'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create uyari --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "Esik uyarisi" 2>/dev/null || true
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.uyari.outputs.baslik }}" \
            --body-file "$RUNNER_TEMP/uyari.md" \
            --label uyari 2>/dev/null \
          || gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.uyari.outputs.baslik }}" \
            --body-file "$RUNNER_TEMP/uyari.md"

      # Kanal 2 (istege bagli): Telegram. TELEGRAM_TOKEN ve TELEGRAM_CHAT_ID
      # sirlari tanimliysa calisir, degilse sessizce atlanir.
      - name: Telegram bildirimi
        if: steps.uyari.outputs.uyari == 'evet'
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram sirlari yok; atlandi."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text@$RUNNER_TEMP/uyari.md" > /dev/null

      - name: Sonuclari isle
        run: |
          git config user.name "gundem-bot"
          git config user.email "actions@github.com"
          # --ignore-removal: baska bir kosunun ekledigi ama bu kosunun calisma
          # agacinda bulunmayan dosyalari "silinmis" diye islemesin. 18 Eylul'de
          # tam bu yuzden gunun analizi uretildikten bir dakika sonra, eski bir
          # taramanin itmesiyle depodan silindi.
          git add --ignore-removal data
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          MESAJ="veri: tarama $(date -u '+%Y-%m-%d %H:%M UTC')"
          git commit -m "$MESAJ"
          # Araya baska bir kosu girdiyse: kendi degisikliklerimizi uzaktakinin
          # ucune TASI (rebase). Boylece yalnizca bu kosunun dokundugu dosyalar
          # uygulanir; otekilerin dosyalari oldugu gibi kalir. Catismada bu
          # kosunun taze verisi kazanir (-X theirs: yeniden uygulanan isleme).
          for DENEME in 1 2 3 4 5 6; do
            if git push; then
              echo "itildi (deneme $DENEME)"
              exit 0
            fi
            echo "uzakta yeni isleme var; degisiklikler ucuna tasiniyor (deneme $DENEME)"
            sleep $((DENEME * 3))
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "::warning::tasima basarisiz; yeniden denenecek"
            fi
          done
          git push && { echo "itildi (son deneme)"; exit 0; }
          echo "::error::Veri itilemedi."
          exit 1

      # Tarayici onbellegi: GitHub Pages arayuz dosyalarina max-age=600
      # veriyor ve Pages'te baslik ayarlanamiyor. Yayinlanan kopyada css/js
      # baglantilarina isleme kimligi ekliyoruz; boylece yeni surum aninda
      # gelir, eskisi onbellekte kalmaz. Depodaki dosyalar degismez.
      - name: Arayuz dosyalarina surum damgasi
        run: |
          SURUM=$(git rev-parse --short HEAD)
          sed -i "s|href=\"assets/style.css\"|href=\"assets/style.css?v=$SURUM\"|g; \
                  s|src=\"assets/app.js\"|src=\"assets/app.js?v=$SURUM\"|g; \
                  s|src=\"assets/haber.js\"|src=\"assets/haber.js?v=$SURUM\"|g" \
              index.html haber.html
          echo "surum damgasi: $SURUM"
          grep -o 'assets/[a-z.]*?v=[0-9a-f]*' index.html haber.html | sort -u

      # enablement: Pages depoda kapaliysa is akisi kendisi acar (pages: write)
      - uses: actions/configure-pages@v5
        continue-on-error: true
        id: pages
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: .
    outputs:
      pages: ${{ steps.pages.outcome }}

  yayinla:
    needs: tara
    if: needs.tara.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
